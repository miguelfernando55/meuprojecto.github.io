<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Página básica</title>
	<style>
		:root {
			color-scheme: light;
			--background: #eef4f1;
			--surface: #ffffff;
			--text: #18322a;
			--muted: #5f756d;
			--accent: #17805f;
			--accent-dark: #0f6047;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			background: linear-gradient(135deg, #dceee5, var(--background));
			color: var(--text);
			font-family: Georgia, "Times New Roman", serif;
		}

		.card {
			width: min(100%, 560px);
			padding: 48px;
			background: var(--surface);
			border: 1px solid #d4e5dd;
			border-radius: 18px;
			box-shadow: 0 18px 50px rgba(24, 50, 42, 0.12);
			text-align: center;
		}

		.eyebrow {
			margin: 0 0 12px;
			color: var(--accent);
			font: 700 0.78rem/1.2 Arial, sans-serif;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-size: clamp(2.2rem, 7vw, 4rem);
			line-height: 1;
		}

		.description {
			margin: 20px auto 28px;
			max-width: 38ch;
			color: var(--muted);
			font: 1.05rem/1.6 Arial, sans-serif;
		}

		button {
			border: 0;
			border-radius: 999px;
			padding: 13px 22px;
			background: var(--accent);
			color: white;
			cursor: pointer;
			font: 700 0.95rem Arial, sans-serif;
			transition: background 160ms ease, transform 160ms ease;
		}

		button:hover {
			background: var(--accent-dark);
			transform: translateY(-2px);
		}

		button:focus-visible {
			outline: 3px solid #9ed7c2;
			outline-offset: 3px;
		}

		#message {
			min-height: 1.5em;
			margin: 22px 0 0;
			color: var(--accent-dark);
			font: 700 0.95rem Arial, sans-serif;
		}

		.clock {
			margin: 28px 0 0;
			padding-top: 20px;
			border-top: 1px solid #e1ece7;
			color: var(--muted);
			font: 0.85rem Arial, sans-serif;
		}

		@media (max-width: 480px) {
			.card {
				padding: 36px 24px;
			}
		}
	</style>
</head>
<body>
	<main class="card">
		<p class="eyebrow">Meu primeiro projeto</p>
		<h1>Olá, mundo!</h1>
		<p class="description">Uma página básica feita com HTML, CSS e JavaScript.</p>
		<button id="actionButton" type="button">Clique aqui</button>
		<p id="message" aria-live="polite"></p>
		<p class="clock">Horário local: <time id="clock" datetime=""></time></p>
	</main>

	<script>
		const actionButton = document.querySelector('#actionButton');
		const message = document.querySelector('#message');
		const clock = document.querySelector('#clock');

		actionButton.addEventListener('click', () => {
			message.textContent = 'Você clicou no botão. O JavaScript está funcionando!';
		});

		function updateClock() {
			const now = new Date();
			clock.dateTime = now.toISOString();
			clock.textContent = now.toLocaleTimeString('pt-BR');
		}

		updateClock();
		setInterval(updateClock, 1000);
	</script>
</body>
</html>
